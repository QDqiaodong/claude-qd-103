server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:grain_depot;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
